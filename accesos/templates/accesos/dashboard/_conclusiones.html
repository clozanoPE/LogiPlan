{# «Lo que dicen los datos»: frases automáticas (solo hechos que los datos sostienen). Bloque negro con naranja. #}
<section class="mb-6 bg-daryza-dark text-white rounded-3xl p-5 sm:p-6 border-l-8 border-marca">
    <h2 class="text-[11px] font-black uppercase tracking-[0.3em] text-marca mb-4"><i class="fas fa-lightbulb mr-1"></i> Lo que dicen los datos</h2>
    <ul class="grid grid-cols-1 lg:grid-cols-2 gap-x-8 gap-y-3">
        {% for c in frases %}
        <li class="flex gap-3 items-start">
            <i class="fas {{ c.icono }} mt-1 w-5 text-center {% if c.alerta %}text-amber-400{% else %}text-marca{% endif %}" aria-hidden="true"></i>
            <span class="text-sm font-medium leading-relaxed">{% if c.alerta %}<span class="font-black text-amber-400">Atención: </span>{% endif %}{{ c.texto }}</span>
        </li>
        {% endfor %}
    </ul>
</section>
